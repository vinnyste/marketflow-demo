name: Publish sanitized demo

on:
  push:
    paths:
      - marketflow-demo-clean.zip

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack sanitized project
        run: |
          mkdir -p .publish
          unzip -q marketflow-demo-clean.zip -d .publish
          cp -a .publish/marketflow-demo/. .
          rm -rf .publish marketflow-demo-clean.zip
          rm -f .github/workflows/publish-demo.yml
      - name: Commit published project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish sanitized portfolio demo"
          git push
